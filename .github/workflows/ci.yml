name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    - name: Install server dependencies
      working-directory: server
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: true

    - name: Install client dependencies
      working-directory: client
      run: npm ci

    - name: Validate operational scripts
      run: |
        bash -n deploy.sh deploy_osx.sh start.sh start_osx.sh update.sh update_osx.sh
        node --check ecosystem.config.js

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high --prefix server && npm audit --omit=dev --audit-level=high --prefix client

    - name: Test server
      working-directory: server
      run: npm test -- --runInBand
      env:
        CI: true

    - name: Lint client
      working-directory: client
      run: npm run lint

    - name: Test client
      working-directory: client
      run: npm test -- --run

    - name: Build client
      working-directory: client
      run: npm run build
