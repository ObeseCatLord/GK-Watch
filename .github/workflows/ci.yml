name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 20
        package-manager-cache: false
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    - name: Install server dependencies
      working-directory: server
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: true

    - name: Install client dependencies
      working-directory: client
      run: npm ci

    - name: Validate operational scripts
      run: |
        bash -n deploy.sh deploy_remote.sh deploy_osx.sh start.sh start_osx.sh update.sh update_osx.sh
        node --check ecosystem.config.js
        node --check scripts/gkwatch-tasks.mjs
        node --test scripts/gkwatch-tasks.test.mjs

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high --prefix server && npm audit --omit=dev --audit-level=high --prefix client

    - name: Test server
      working-directory: server
      run: npm test -- --runInBand
      env:
        CI: true

    - name: Lint client
      working-directory: client
      run: npm run lint

    - name: Test client
      working-directory: client
      run: npm test -- --run

    - name: Build client
      working-directory: client
      run: npm run build

  windows-script-smoke:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 20
        package-manager-cache: false

    - name: Test shared task runner
      run: node --test scripts/gkwatch-tasks.test.mjs

    - name: Validate batch entry points
      shell: cmd
      env:
        GKWATCH_NO_PAUSE: 1
      run: |
        call start.bat --check
        call update.bat --check
        call deploy.bat --check
